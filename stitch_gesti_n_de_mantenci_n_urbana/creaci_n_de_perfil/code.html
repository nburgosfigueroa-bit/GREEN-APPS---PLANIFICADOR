<!DOCTYPE html><html class="light" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Crear Nuevo Perfil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f3f4f5",
                        "surface-tint": "#3e6654",
                        "secondary": "#745b00",
                        "on-tertiary-container": "#a0a7aa",
                        "on-secondary-fixed-variant": "#584400",
                        "secondary-fixed": "#ffe08b",
                        "surface-container": "#edeeef",
                        "on-secondary-fixed": "#241a00",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#41484a",
                        "error": "#ba1a1a",
                        "secondary-container": "#fdd355",
                        "outline-variant": "#c1c8c2",
                        "primary": "#002d1d",
                        "on-background": "#191c1d",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#002114",
                        "surface": "#f8f9fa",
                        "outline": "#717973",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#414944",
                        "tertiary-fixed-dim": "#c1c8ca",
                        "tertiary": "#202729",
                        "surface-container-highest": "#e1e3e4",
                        "primary-fixed-dim": "#a4d0b9",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-dim": "#d9dadb",
                        "on-secondary": "#ffffff",

                        "error-container": "#ffdad6",
                        "on-primary-container": "#85af99",
                        "surface-variant": "#e1e3e4",
                        "inverse-primary": "#a4d0b9",

                        "secondary-fixed-dim": "#ebc246",
                        "on-primary-fixed-variant": "#264e3d",
                        "primary-fixed": "#c0edd4",
                        "surface-container-high": "#e7e8e9",
                        "inverse-surface": "#2e3132",
                        "primary-container": "#1a4332",
                        "on-surface": "#191c1d",
                        "surface-bright": "#f8f9fa",
                        "on-tertiary-fixed": "#161d1f",
                        "on-secondary-container": "#735a00",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#dde4e6",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xl": "64px",
                        "container-max": "1280px",
                        "sm": "12px",
                        "gutter": "20px",
                        "xs": "4px",
                        "base": "8px",

                        "lg": "40px"
                    },
                    "fontFamily": {
                        "display-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"],

                        "label-technical": ["13px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "button-text": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col justify-center items-center p-md antialiased">
<main class="w-full max-w-[480px]">
<div class="mb-lg flex flex-col items-center text-center">
<span class="material-symbols-outlined text-primary text-[48px] mb-sm" style="font-variation-settings: &quot;FILL&quot; 1;">
                person_add
            </span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">
                Crear Nuevo Perfil
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">
                Ingrese los datos técnicos para registrar el nuevo usuario en el sistema.
            </p>
</div>
<form class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.02)] flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-technical text-label-technical text-on-surface-variant flex items-center gap-xs" for="fullName">
<span class="material-symbols-outlined text-[16px]">badge</span>
                    Full Name
                </label>
<input class="bg-surface-container-low border border-outline-variant rounded p-sm font-body-md text-body-md text-on-surface w-full focus:outline-none focus:border-primary focus:border-2 transition-all" id="fullName" name="fullName" placeholder="Ej. Juan Pérez" required="" type="text">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-technical text-label-technical text-on-surface-variant flex items-center gap-xs" for="rut">
<span class="material-symbols-outlined text-[16px]">id_card</span>
                    RUT
                </label>
<input class="bg-surface-container-low border border-outline-variant rounded p-sm font-body-md text-body-md text-on-surface w-full focus:outline-none focus:border-primary focus:border-2 transition-all" id="rut" name="rut" placeholder="Ej. 12.345.678-9" required="" type="text">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-technical text-label-technical text-on-surface-variant flex items-center gap-xs" for="email">
<span class="material-symbols-outlined text-[16px]">mail</span>
                    Email
                </label>
<input class="bg-surface-container-low border border-outline-variant rounded p-sm font-body-md text-body-md text-on-surface w-full focus:outline-none focus:border-primary focus:border-2 transition-all" id="email" name="email" placeholder="correo@empresa.com" required="" type="email">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-technical text-label-technical text-on-surface-variant flex items-center gap-xs" for="password">
<span class="material-symbols-outlined text-[16px]">lock</span>
                    Password
                </label>
<input class="bg-surface-container-low border border-outline-variant rounded p-sm font-body-md text-body-md text-on-surface w-full focus:outline-none focus:border-primary focus:border-2 transition-all" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-technical text-label-technical text-on-surface-variant flex items-center gap-xs" for="role">
<span class="material-symbols-outlined text-[16px]">admin_panel_settings</span>
                    Rol
                </label>
<div class="relative">
<select class="appearance-none bg-surface-container-low border border-outline-variant rounded p-sm pr-lg font-body-md text-body-md text-on-surface w-full focus:outline-none focus:border-primary focus:border-2 transition-all cursor-pointer" id="role" name="role" required="">
<option disabled="" selected="" value="">Seleccione un rol...</option>
<option value="admin">Administrador</option>
<option value="lider">Líder de Equipo (Supervisores y Capataces)</option>
<option value="encargado">Encargado (Cierre de OT)</option>
<option value="inspeccion">Inspección Técnica (beta)</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
                        expand_more
                    </span>
</div>
</div><div class="flex flex-col gap-xs">
<label class="font-label-technical text-label-technical text-on-surface-variant flex items-center gap-xs" for="contract">
<span class="material-symbols-outlined text-[16px]">description</span>
                    Seleccione su contrato
                </label>
<div class="relative">
<select class="appearance-none bg-surface-container-low border border-outline-variant rounded p-sm pr-lg font-body-md text-body-md text-on-surface w-full focus:outline-none focus:border-primary focus:border-2 transition-all cursor-pointer" id="contract" name="contract" required="">
<option disabled="" selected="" value="">Seleccione un contrato...</option>
<option value="maipu_3">Maipú Zona 3 (AKRO)</option>
<option value="maipu_6">Maipú Zona 6 (AKRO)</option>
<option value="maipu_7">Maipú Zona 7 (NÚCLEO)</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
                        expand_more
                    </span>
</div>
</div>
<button class="mt-sm bg-primary text-on-primary font-button-text text-button-text rounded-full py-sm px-md w-full flex items-center justify-center gap-xs transition-colors hover:bg-primary-container hover:text-on-primary-container focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:outline-none" type="submit">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
                Crear Perfil
            </button>
</form>
</main>


</body></html>
