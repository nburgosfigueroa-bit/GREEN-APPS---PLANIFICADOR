<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./greenapps/">
  <title>GreenApps — Sistema de Gestión Urbana</title>
  <link rel="canonical" href="./greenapps/">
  <script type="text/javascript">
    window.location.href = "./greenapps/";
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #002d1d;
    }
    .card {
      background: white;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 420px;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #002d1d;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    a {
      color: #1a4332;
      font-weight: 600;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Cargando GreenApps...</h2>
    <p>Redirigiendo a la plataforma operativa.</p>
    <p><small>Si no eres redirigido automáticamente, <a href="./greenapps/">haz clic aquí</a>.</small></p>
  </div>
</body>
</html>
